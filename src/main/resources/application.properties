spring.application.name=notification-service

server.port=8081

# Локальный SMTP-сервер Mailpit
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.default-encoding=UTF-8

spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Таймауты SMTP в миллисекундах
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Адрес отправителя для локальной проверки
app.mail.from=no-reply@example.com

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Отдельная группа потребителей notification-service
spring.kafka.consumer.group-id=notification-service

# При первом запуске группы читать доступные старые события
spring.kafka.consumer.auto-offset-reset=earliest

# Подтверждением обработки управляет Spring Kafka
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

# Десериализация ключа
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Обработка ошибок десериализации JSON
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties[spring.deserializer.value.delegate.class]=org.springframework.kafka.support.serializer.JsonDeserializer

# Преобразование JSON в локальный DTO notification-service
spring.kafka.consumer.properties[spring.json.value.default.type]=ru.maxon.notification.event.UserEvent
spring.kafka.consumer.properties[spring.json.trusted.packages]=ru.maxon.notification.event
spring.kafka.consumer.properties[spring.json.use.type.headers]=false

# Топик событий пользователей
app.kafka.user-events-topic=user-events